<body class="bg-background text-on-background font-body-md min-h-screen flex">

<nav class="bg-surface-container-low border-r border-outline-variant fixed left-0 top-0 h-screen w-[260px] flex flex-col py-lg z-50 hidden md:flex">
<div class="px-md mb-xl flex items-center gap-md">

</div>
<div>

<div class="font-body-sm text-body-sm text-on-surface-variant">System Management</div>
</div>
</div>
<div class="flex flex-col gap-sm px-sm flex-grow overflow-y-auto" id="admin-sidebar"></div>
</nav>
<!-- Main Content Area -->
<div class="flex-1 flex flex-col min-w-0 md:ml-[260px]">

<div class="flex items-center gap-md">
<div class="hidden lg:block">
<h2 class="font-headline-md text-headline-md text-on-surface" id="app-title">Dashboard</h2>
</div>
<div class="lg:hidden">
<h1 class="font-headline-md text-headline-md font-bold text-primary">EcoWaste</h1>
</div>
</div>
<div class="flex items-center gap-md">
<div class="relative hidden sm:flex items-center">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant">search</span>
<input class="pl-[36px] pr-sm py-sm rounded-DEFAULT border border-outline-variant bg-surface-container-lowest text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary w-64 font-body-sm text-body-sm placeholder:text-on-surface-variant/50" placeholder="Search across portal..." type="text">
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-highest text-on-surface-variant transition-colors">
<span class="material-symbols-outlined">notifications</span>
</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-highest text-on-surface-variant transition-colors">
<span class="material-symbols-outlined">help</span>
</button>
<div class="h-8 w-px bg-outline-variant hidden sm:block"></div>
<div class="relative">
<button id="user-menu-btn" class="w-10 h-10 rounded-full overflow-hidden border-2 border-transparent hover:border-primary transition-colors cursor-pointer" aria-haspopup="menu" aria-expanded="false" type="button">
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'FILL' 1;">person</span>
</button>
<div id="user-menu" class="hidden absolute right-0 top-12 w-56 bg-surface-container-lowest border border-outline-variant rounded-xl shadow-lg z-50 overflow-hidden">
<a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-surface-container-low transition-colors" data-menu-action="profile">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">person</span>
<span class="font-body-md text-body-md text-on-surface">Profile</span>
</a>
<button class="w-full flex items-center gap-3 px-4 py-3 hover:bg-error-container/20 transition-colors text-left" data-menu-action="signout" type="button">
<span class="material-symbols-outlined text-error text-[20px]">logout</span>
<span class="font-body-md text-body-md text-error font-medium">Sign out</span>
</button>
