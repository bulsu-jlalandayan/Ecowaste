<body class="min-h-screen flex items-center justify-center bg-surface px-margin sm:px-lg py-xl">
<div class="w-full max-w-md bg-surface-container-lowest border border-outline-variant rounded-xl p-lg flex flex-col gap-lg shadow-sm">
<div class="flex justify-center items-center gap-xs">
<span class="material-symbols-outlined text-primary text-4xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">recycling</span>
<span class="font-headline-lg text-headline-lg text-primary font-bold tracking-tight">EcoWaste</span>
</div>
<div class="text-center flex flex-col gap-xs">
<h1 class="font-headline-lg text-headline-lg text-on-surface">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to manage logistics and routing.</p>
</div>
<div id="message" class="hidden text-sm font-body-sm rounded-lg px-md py-sm"></div>
<form id="loginForm" class="flex flex-col gap-md">
<div class="flex flex-col gap-xs">
<label class="font-body-sm text-body-sm font-semibold text-on-surface-variant" for="email">Email</label>
<input class="w-full h-12 bg-surface-container-lowest border border-outline-variant rounded-lg px-sm font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-primary focus:ring-2 focus:ring-primary/10 focus:outline-none transition-all" id="email" placeholder="operator@ecowaste.com" type="email"/>
</div>
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-body-sm text-body-sm font-semibold text-on-surface-variant" for="password">Password</label>
<a class="font-body-sm text-body-sm text-primary font-semibold hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<input class="w-full h-12 bg-surface-container-lowest border border-outline-variant rounded-lg px-sm font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-primary focus:ring-2 focus:ring-primary/10 focus:outline-none transition-all" id="password" placeholder="••••••••" type="password"/>
</div>
<button class="w-full h-12 mt-sm bg-primary-container text-surface-container-lowest font-body-md text-body-md font-semibold rounded-lg hover:bg-tertiary-container transition-colors flex justify-center items-center" type="submit">
                Sign In
            </button>
</form>
<div class="text-center font-body-sm text-body-sm text-on-surface-variant mt-xs">
            Don't have an account? <a class="text-primary font-semibold hover:underline" href="Registration.html">Sign Up</a>
</div>
</div>
<script>
document.getElementById("loginForm").addEventListener("submit", async function (e) {
  e.preventDefault();
  const msgEl = document.getElementById("message");
  const submitBtn = this.querySelector('button[type="submit"]');

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  msgEl.classList.add("hidden");

  if (!email || !password) {
    msgEl.textContent = "Email and password are required.";
    msgEl.className = "text-sm font-body-sm rounded-lg px-md py-sm bg-error-container text-on-error-container";
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "Signing in...";

  try {
    const loginRes = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=password", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON_KEY,
      },
      body: JSON.stringify({ email: email, password: password }),
    });

    const loginData = await loginRes.json();

    if (!loginRes.ok) {
      throw new Error(loginData.error_description || loginData.msg || "Login failed.");
    }

    localStorage.setItem("sb-access-token", loginData.access_token);
    localStorage.setItem("sb-refresh-token", loginData.refresh_token);

    const userId = loginData.user.id;

    const profileRes = await fetch(SUPABASE_URL + "/rest/v1/profiles?id=eq." + userId + "&select=role", {
      method: "GET",
      headers: {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + loginData.access_token,
      },
    });

    const profiles = await profileRes.json();

    if (!profileRes.ok || profiles.length === 0) {
      throw new Error("Could not retrieve user profile.");
    }

    const role = profiles[0].role;
    localStorage.setItem("user-role", role);

    if (role === "admin") {
      window.location.href = "../AdminPages/admin.html";
    } else if (role === "collector") {
      window.location.href = "../CollectorPages/C_Dashboard.html";
    } else {
      window.location.href = "../ResidentPages/resident.html";
    }

  } catch (err) {
    msgEl.textContent = err.message;
    msgEl.className = "text-sm font-body-sm rounded-lg px-md py-sm bg-error-container text-on-error-container";
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Sign In";
  }
});
</script>
