<body class="bg-surface-container-low min-h-screen flex items-center justify-center p-4">
<!-- Registration Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl shadow-[0_4px_12px_rgba(15,23,42,0.05)] w-full max-w-[500px] overflow-hidden">
<!-- Header -->
<div class="pt-lg pb-md px-margin text-center border-b border-outline-variant">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Join EcoWaste</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Select your role to get started.</p>
</div>
<!-- Content -->
<div class="p-margin">
<!-- Role Selection -->
<div class="grid grid-cols-2 gap-4 mb-md">
<!-- Resident Role -->
<label class="cursor-pointer relative">
<input checked="" class="peer sr-only" name="role" type="radio" value="resident"/>
<div class="h-full border border-outline-variant rounded-lg p-md text-center hover:bg-surface-container transition-colors peer-checked:border-primary peer-checked:bg-surface-container-highest peer-checked:shadow-[0_0_0_2px_rgba(0,53,39,0.1)]">
<span class="material-symbols-outlined text-[32px] text-primary mb-sm block" style="font-variation-settings: 'FILL' 0;">home</span>
<span class="font-label-caps text-label-caps text-on-surface block">Resident</span>
</div>
</label>
<!-- Collector Role -->
<label class="cursor-pointer relative">
<input class="peer sr-only" name="role" type="radio" value="collector"/>
<div class="h-full border border-outline-variant rounded-lg p-md text-center hover:bg-surface-container transition-colors peer-checked:border-primary peer-checked:bg-surface-container-highest peer-checked:shadow-[0_0_0_2px_rgba(0,53,39,0.1)]">
<span class="material-symbols-outlined text-[32px] text-primary mb-sm block" style="font-variation-settings: 'FILL' 0;">local_shipping</span>
<span class="font-label-caps text-label-caps text-on-surface block">Collector</span>
</div>
</label>
</div>
<!-- Message Area -->
<div id="message" class="hidden text-sm font-body-sm rounded-lg px-md py-sm mb-sm"></div>
<!-- Form Fields -->
<form id="registerForm" class="space-y-sm">
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-xs" for="fullName">Full Name</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all" id="fullName" placeholder="Jane Doe" type="text"/>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-xs" for="email">Email Address</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all" id="email" placeholder="jane@example.com" type="email"/>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-xs" for="password">Password</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all" id="password" placeholder="••••••••" type="password"/>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary hover:bg-primary-container text-on-primary font-label-caps text-label-caps py-sm px-md rounded-lg transition-colors mt-md flex justify-center items-center gap-xs" type="submit">
                    Create Account
                    <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
</button>
</form>
</div>
<!-- Footer Link -->
<div class="bg-surface py-sm px-margin text-center border-t border-outline-variant">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Already have an account? 
                <a class="text-primary hover:text-primary-container font-medium transition-colors" href="Login.html">Sign In</a>
</p>
</div>
</div>
<script>
document.getElementById("registerForm").addEventListener("submit", async function (e) {
  e.preventDefault();
  var msgEl = document.getElementById("message");
  var submitBtn = this.querySelector('button[type="submit"]');

  var role = document.querySelector('input[name="role"]:checked').value;
  var fullName = document.getElementById("fullName").value.trim();
  var email = document.getElementById("email").value.trim();
  var password = document.getElementById("password").value;

  msgEl.classList.add("hidden");

  if (!fullName || !email || !password) {
    msgEl.textContent = "All fields are required.";
    msgEl.className = "text-sm font-body-sm rounded-lg px-md py-sm mb-sm bg-error-container text-on-error-container";
    return;
  }
  if (password.length < 6) {
    msgEl.textContent = "Password must be at least 6 characters.";
    msgEl.className = "text-sm font-body-sm rounded-lg px-md py-sm mb-sm bg-error-container text-on-error-container";
    return;
  }

  submitBtn.disabled = true;
  submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[16px]">progress_activity</span> Creating Account...';

  try {
    var signupRes = await fetch(SUPABASE_URL + "/auth/v1/signup", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON_KEY,
      },
      body: JSON.stringify({
        email: email,
        password: password,
        data: { full_name: fullName, role: role },
      }),
    });

    var signupData = await signupRes.json();

    if (!signupRes.ok) {
      throw new Error(signupData.error_description || signupData.msg || "Signup failed.");
    }

    var accessToken = signupData.access_token;
    var userId = signupData.user ? signupData.user.id : signupData.id;

    if (accessToken && userId) {
      msgEl.textContent = "Account created successfully! Redirecting to login...";
      msgEl.className = "text-sm font-body-sm rounded-lg px-md py-sm mb-sm bg-primary-container text-on-primary";
      setTimeout(function () {
        window.location.href = "Login.html";
      }, 1500);
    } else {
      msgEl.textContent = "Account created! Please check your email to confirm your account, then sign in.";
      msgEl.className = "text-sm font-body-sm rounded-lg px-md py-sm mb-sm bg-primary-container text-on-primary";
      setTimeout(function () {
        window.location.href = "Login.html";
      }, 3000);
    }

  } catch (err) {
    msgEl.textContent = err.message;
    msgEl.className = "text-sm font-body-sm rounded-lg px-md py-sm mb-sm bg-error-container text-on-error-container";
  } finally {
    submitBtn.disabled = false;
    submitBtn.innerHTML = 'Create Account <span class="material-symbols-outlined text-[16px]">arrow_forward</span>';
  }
});
</script>
