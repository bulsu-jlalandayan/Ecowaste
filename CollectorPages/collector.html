<!DOCTYPE html>

<head>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom Input Styles */
        input[type="text"], input[type="number"], select, textarea {
            border-color: #E5E7EB;
            background-color: #ffffff;
            border-radius: 0.25rem;
            transition-property: color, background-color, border-color, text-decoration-color, fill, stroke;
        }
        input[type="text"]:focus, input[type="number"]:focus, select:focus, textarea:focus {
            border-color: #00288e;
            box-shadow: 0 0 0 2px rgba(0, 40, 142, 0.2);
            outline: none;
        }
        /* Radio Button Styles */
        input[type="radio"] {
            accent-color: #00288e;
        }
        /* Toggle switches */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #00288e;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #00288e;
        }
        /* Table horizontal scroll - clean scrollbars on mobile */
        .table-scroll {
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
        }
        .table-scroll::-webkit-scrollbar {
            height: 8px;
        }
        .table-scroll::-webkit-scrollbar-thumb {
            background-color: #c4c5d5;
            border-radius: 9999px;
        }
        .table-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .table-scroll::-webkit-scrollbar-thumb:hover {
            background-color: #a0a1b0;
        }
        /* Sticky first column shadow cue while scrolling tables */
        .table-scroll table th.sticky,
        .table-scroll table td.sticky {
            box-shadow: 4px 0 6px -4px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>
<body class="bg-background text-on-surface antialiased flex min-h-screen">
<!-- SideNavBar (Desktop only, populated by collector-nav.js) -->
<nav id="collector-sidebar" class="hidden md:flex fixed left-0 top-0 h-screen flex-col p-container-margin w-64 bg-surface border-r border-border-subtle z-40">
<div class="mb-8 flex items-center gap-3">
<div class="w-10 h-10 rounded-lg bg-primary-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary-container filled">eco</span>
</div>
<div>
<h1 class="font-headline-md text-headline-md font-bold text-primary">EcoWaste</h1>
<p class="font-label-sm text-label-sm text-on-surface-variant">Collector Portal</p>
</div>
</div>
<div class="flex-1 overflow-y-auto pr-2" id="collector-sidebar-links"></div>
<div class="mt-4 pt-4 border-t border-border-subtle">
<a href="#" class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:text-on-surface hover:bg-surface-container-low transition-colors duration-200 rounded-lg" data-menu-action="signout">
<span class="material-symbols-outlined">logout</span>
<span class="font-label-md text-label-md" id="side-user-name">—</span>
</a>
</div>
</nav>
<!-- Main Content Wrapper -->
<div class="flex-1 md:ml-64 flex flex-col min-h-screen min-w-0">
<!-- TopAppBar -->
<header class="bg-surface border-b border-border-subtle flex justify-between items-center h-16 px-container-margin sticky top-0 z-30">
<div class="flex items-center gap-3">
<button id="hamburger-btn" class="md:hidden text-on-surface-variant hover:bg-surface-container-low rounded-lg p-2 transition-colors" aria-label="Open navigation menu" type="button">
<span class="material-symbols-outlined">menu</span>
</button>
<h2 id="app-title" class="hidden md:block font-headline-md text-headline-md text-on-surface">Dashboard</h2>
<h2 class="md:hidden font-headline-md text-headline-md text-on-surface">EcoWaste</h2>
</div>
<div class="flex items-center gap-4">
<button class="text-on-surface-variant hover:bg-surface-container-low rounded-full p-2 transition-colors">
<span class="material-symbols-outlined">notifications</span>
</button>
<button class="text-on-surface-variant hover:bg-surface-container-low rounded-full p-2 transition-colors">
<span class="material-symbols-outlined">account_circle</span>
</button>
</div>
</header>
<!-- Canvas (populated by collector-app.js) -->
<main class="flex-1 p-4 sm:p-container-margin overflow-y-auto min-w-0 overflow-x-hidden">
<div id="app" class="flex-1 min-w-0 pb-20 md:pb-0"></div>
</main>
</div>
<!-- Mobile Drawer Overlay -->
<div id="drawer-overlay" class="hidden fixed inset-0 bg-black/40 z-40 md:hidden"></div>
<!-- Mobile Drawer (populated by collector-nav.js, shares links with sidebar) -->
<div id="drawer" class="fixed inset-y-0 left-0 w-72 max-w-[80%] bg-surface border-r border-border-subtle z-50 transform -translate-x-full transition-transform duration-300 md:hidden flex flex-col p-container-margin">
<div class="mb-8 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-lg bg-primary-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary-container filled">eco</span>
</div>
<div>
<h1 class="font-headline-md text-headline-md font-bold text-primary">EcoWaste</h1>
<p class="font-label-sm text-label-sm text-on-surface-variant">Collector Portal</p>
</div>
</div>
<button id="drawer-close-btn" class="md:hidden text-on-surface-variant hover:bg-surface-container-low rounded-lg p-2 transition-colors" aria-label="Close navigation menu" type="button">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<div class="flex-1 overflow-y-auto pr-2" id="collector-drawer-links"></div>
<div class="mt-4 pt-4 border-t border-border-subtle">
<a href="#" class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:text-on-surface hover:bg-surface-container-low transition-colors duration-200 rounded-lg" data-menu-action="signout">
<span class="material-symbols-outlined">logout</span>
<span class="font-label-md text-label-md" id="side-user-name">—</span>
</a>
</div>
</div>
<script src="collector-gate.js"></script>
<script src="collector-data.js"></script>
<script src="collector-ui.js"></script>
<script src="collector-nav.js"></script>
<script src="collector-app.js"></script>
</body>
</html>
